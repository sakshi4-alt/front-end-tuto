!DOCTYPE html>
<html lang = "en">
       <title>Document</title> 
        <head>
            <Style>
                .Container{
                    width: 1000px;
                    background-color: rgb(196, 255, 252);
                   
                    display: grid;
                    grid-template-columns: 20px 60px auto;
                    grid-template-rows: 200px 200px  auto;
                    grid-gap: 20px 20px;
                }
                .item1{
                    background-color: brown;
                }
                .item2{
                    background-color: aquamarine;
                }
                .item3{
                    background-color: azure;
                }
                .item4{
                    background-color: aqua;
                }
                .item5{
                    background-color: bisque;
                }
                .item6{
                    background-color: blue;
                }
            </Style>
            <body>
        <div class="Container">
            <div class="item1">1st</div>
             <div class="item2">2nd</div>
              <div class="item3">3rd</div>
               <div class="item4">4th</div>
                <div class="item5">5th</div>
                 <div class="item6">6th</div>

        </div>
            </body>
            </head>
</html>
